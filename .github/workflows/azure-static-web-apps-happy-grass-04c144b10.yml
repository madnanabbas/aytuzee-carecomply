name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - staging

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - staging

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    runs-on: ubuntu-latest

    name: Build and Deploy

    steps:
      # -------------------------------------------------------
      # Checkout source code
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # -------------------------------------------------------
      # Install Node.js version supported by Angular 22
      # -------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      # -------------------------------------------------------
      # Install exact dependencies from package-lock.json
      # -------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -------------------------------------------------------
      # Build Angular production application
      # -------------------------------------------------------
      - name: Build Angular
        run: npm run build

      # -------------------------------------------------------
      # Deploy already-built Angular files to Azure
      # -------------------------------------------------------
      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_GRASS_04C144B10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"

          # We already built Angular above.
          app_location: "dist/care-comply/browser"

          # .NET API will be deployed separately.
          api_location: ""

          # Not required when skip_app_build is true.
          output_location: ""

          # Prevent Azure/Oryx from rebuilding Angular.
          skip_app_build: true


  # =========================================================
  # CLOSE STATIC WEB APP PREVIEW ENVIRONMENT
  # =========================================================
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    runs-on: ubuntu-latest

    name: Close Pull Request Environment

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_GRASS_04C144B10 }}
          action: "close"